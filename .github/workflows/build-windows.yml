name: Build Windows

# Every push to main builds the game (download it from the run's "Artifacts").
# Publishing a GitHub Release (or pushing a v* tag) also attaches a zip to that release.
# No game files are used or produced: the exe asks for the player's own package on first start.
# The ReXGlue SDK is built from source with NativeXRenderer's changes (patches/rexglue-sdk), and
# NativeXRenderer (thirdparty/native_x_renderer) is built in: the default renderer, Xenos as the alternative.
on:
  push:
    branches: [main, native-x-renderer]
    # Publishing a release with a new v* tag creates the tag, which runs this once and attaches the zip.
    # (No separate `release` trigger: it built every release twice.)
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # ReXGlue SDK release the patches apply to (built from source with the game).
  REXGLUE_SDK_REF: v0.10.0

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      # LF everywhere: DiligentCore's patches need an unmodified checkout (CRLF shows as edits).
      - name: Keep LF line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Checkout project
        uses: actions/checkout@v4

      # DiligentCore's submodules (SPIRV-Cross test files) need long paths on Windows.
      - name: Submodules (long paths)
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git submodule update --init --recursive --depth 1 --jobs 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Game-side changes to NativeXRenderer, carried as patches until they are upstream.
      - name: Apply NativeXRenderer patches
        shell: pwsh
        working-directory: thirdparty/native_x_renderer
        run: |
          foreach ($p in (Get-ChildItem ..\..\patches\native_x_renderer\*.patch | Sort-Object Name)) {
            git apply --whitespace=nowarn $p.FullName
            if ($LASTEXITCODE -ne 0) { Write-Error "patch failed: $($p.Name)"; exit 1 }
          }
          git status --short

      - name: Install LLVM (clang 20+) and Ninja
        shell: pwsh
        run: |
          choco install llvm ninja -y --no-progress
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: MSVC environment (headers/libs for clang)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Toolchain versions
        shell: pwsh
        run: |
          clang++ --version
          cmake --version
          ninja --version

      # ---------- ReXGlue SDK (source tree, patched for NativeXRenderer) ----------
      - name: Checkout ReXGlue SDK
        uses: actions/checkout@v4
        with:
          repository: rexglue/rexglue-sdk
          ref: ${{ env.REXGLUE_SDK_REF }}
          path: rexglue-sdk
          submodules: recursive

      - name: Apply NativeXRenderer's SDK changes
        shell: pwsh
        working-directory: rexglue-sdk
        run: |
          git -c user.name=ci -c user.email=ci@local am --3way (Get-ChildItem ..\patches\rexglue-sdk\*.patch | Sort-Object Name | ForEach-Object FullName)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git log --oneline -9

      # License text for the release zip (also covers the Xenia-derived parts).
      - name: Fetch SDK license
        uses: actions/checkout@v4
        with:
          repository: rexglue/rexglue-sdk
          ref: ${{ env.REXGLUE_SDK_REF }}
          path: rexglue-sdk-license
          sparse-checkout: LICENSE
          sparse-checkout-cone-mode: false

      # ---------- Game ----------
      - name: Compiler cache for generated code
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: mad-riders-nxr-win-amd64

      - name: Configure game
        shell: pwsh
        run: |
          cmake -S . -B out -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ `
            "-DCMAKE_C_FLAGS=-march=x86-64-v2" "-DCMAKE_CXX_FLAGS=-march=x86-64-v2 -gcodeview -gline-tables-only" `
            "-DCMAKE_EXE_LINKER_FLAGS=-Wl,/DEBUG" `
            "-DMADRIDERS_BUILD=$("$env:GITHUB_SHA".Substring(0,7))" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DMADRIDERS_SKIP_CODEGEN=ON `
            -DREXGLUE_ENABLE_TRACY=OFF -DREXGLUE_USE_VULKAN=ON `
            "-DREXSDK_DIR=$env:GITHUB_WORKSPACE/rexglue-sdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build game
        shell: pwsh
        run: |
          cmake --build out --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out\mad_riders.exe dist\
          # Symbols: the crash handler uses them to name the crashing function.
          if (-not (Test-Path out\mad_riders.pdb)) { Write-Error "mad_riders.pdb was not produced"; exit 1 }
          Copy-Item out\mad_riders.pdb dist\
          Get-ChildItem out -Filter *.dll | Copy-Item -Destination dist\
          # SDK built from source: its DLLs (rexruntime, the GPU plugin, SDL...) may sit in subfolders.
          Get-ChildItem out -Recurse -Filter *.dll | Where-Object { $_.FullName -notmatch 'CMakeFiles' } |
            Where-Object { -not (Test-Path ("dist\" + $_.Name)) } | Copy-Item -Destination dist\
          if (-not (Test-Path dist\rexruntime.dll)) { Write-Error "rexruntime.dll missing"; Get-ChildItem out -Recurse -Filter *.dll | Select FullName; exit 1 }
          Copy-Item packaging\README.txt dist\
          New-Item -ItemType Directory -Force dist\licenses | Out-Null
          Copy-Item LICENSE dist\licenses\mad-riders-recomp-LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.md dist\licenses\
          Copy-Item rexglue-sdk-license\LICENSE dist\licenses\rexglue-sdk-LICENSE.txt
          # SDK + third-party licenses (BSD-3-Clause, Xenia, SDL3, ...): installed to <prefix>\licenses
          Get-ChildItem rexglue-sdk\thirdparty -Directory | ForEach-Object {
            $lic = Get-ChildItem $_.FullName -File -Filter LICENSE* -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($lic) { Copy-Item $lic.FullName ("dist\licenses\LICENSE-" + $_.Name + ".txt") }
          }
          Copy-Item thirdparty\native_x_renderer\LICENSE dist\licenses\NativeXRenderer-LICENSE.txt
          Copy-Item thirdparty\native_x_renderer\THIRD_PARTY_NOTICES.md dist\licenses\NativeXRenderer-THIRD_PARTY_NOTICES.md
          if (-not (Get-ChildItem dist\licenses -Recurse -Filter LICENSE* | Where-Object { $_.Name -notin @('mad-riders-recomp-LICENSE.txt', 'rexglue-sdk-LICENSE.txt') })) {
            Write-Error "SDK license files not found"; exit 1
          }
          Get-ChildItem dist\licenses -Recurse | Select-Object -ExpandProperty FullName
          Get-ChildItem dist

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: mad_riders-win-amd64
          path: dist/

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $zip = "MadRiders-$env:GITHUB_REF_NAME-win64.zip"
          New-Item -ItemType Directory -Force pkg\MadRiders | Out-Null
          Copy-Item -Recurse dist\* pkg\MadRiders\
          Compress-Archive -Path pkg\MadRiders -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
          # Tags with a suffix (v0.1.0-alpha) are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
